<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Status - CodyMKW</title>
<meta name="description" content="Live Nintendo Switch presence for CodyMKW.">
<meta name="theme-color" content="#0f0f10">
<style>
  :root {
    --bg: #0f0f10;
    --card: #18181b;
    --border: #2a2a2e;
    --text: #ececef;
    --muted: #8b8b92;
    --accent: #e60012;
    --online: #4caf50;
    --inactive: #e0a94a;
    --offline: #6b6b70;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 50% 0%, rgba(230,0,18,0.08), transparent 55%);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }

  #avatarImage {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    object-fit: cover;
    background: #000;
    flex-shrink: 0;
  }

  .header-text { min-width: 0; }

  #playerName {
    font-size: 18px;
    font-weight: 700;
    display: block;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    font-size: 13px;
    color: var(--muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--offline);
    flex-shrink: 0;
  }

  .dot.online { background: var(--online); }
  .dot.inactive { background: var(--inactive); }

  #gameSection {
    display: none;
    gap: 14px;
    padding-top: 18px;
    margin-top: 18px;
    border-top: 1px solid var(--border);
  }

  .game-flex {
    display: flex;
    gap: 14px;
  }

  #gameImage {
    width: 76px;
    height: 76px;
    border-radius: 12px;
    object-fit: cover;
    background: #000;
    flex-shrink: 0;
  }

  .game-info { min-width: 0; flex: 1; }

  #gameName {
    font-weight: 700;
    font-size: 15px;
    display: block;
    margin-bottom: 6px;
  }

  .sub-line {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .sub-line b { color: var(--text); font-weight: 600; }

  #gameShopLink {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 10px;
    border-radius: 7px;
    background: rgba(230, 0, 18, 0.15);
    color: #ff5a68;
    font-size: 11.5px;
    font-weight: 700;
    text-decoration: none;
  }

  #gameShopLink:hover { background: rgba(230, 0, 18, 0.28); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 18px 0 4px;
  }

  #lastUpdated {
    margin-top: 18px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img id="avatarImage" alt="">
      <div class="header-text">
        <span id="playerName">Loading...</span>
        <div class="status-row">
          <span class="dot" id="statusDot"></span>
          <span id="onlineStatus"></span>
        </div>
      </div>
    </div>

    <div id="gameSection">
      <div class="game-flex">
        <img id="gameImage" alt="">
        <div class="game-info">
          <span id="gameName"></span>

          <div class="sub-line" id="sysDescriptionRow" style="display:none;">
            <span id="sysDescription"></span>
          </div>

          <div class="sub-line" id="splatoonModeRow" style="display:none;">
            <b id="splatoonMode"></b>
            <span id="splatoonStages"></span>
          </div>

          <div class="sub-line" id="salmonRunRow" style="display:none;">
            <b>Salmon Run</b> &mdash;
            <span id="salmonRunBoss"></span> @ <span id="salmonRunStage"></span>
          </div>

          <div class="sub-line">
            <span id="platformType"></span> &middot; <span id="totalPlayTime"></span> played
          </div>

          <a id="gameShopLink" href="#" target="_blank" rel="noopener" style="display:none;">View on eShop</a>
        </div>
      </div>
    </div>

    <div class="empty-state" id="emptyState" style="display:none;"></div>

    <div id="lastUpdated"></div>
  </div>

<script>
  const API_URL = 'https://nxapi-presence.fancy.org.uk/api/presence/644cd5195d154bd5?include-splatoon3=1';
  const SSE_URL = 'https://nxapi-presence.fancy.org.uk/api/presence/644cd5195d154bd5/events?include-splatoon3=1';
  const FALLBACK_REFRESH_MS = 180000; // 3 minutes

  let fallbackInterval = null;

  function formatPlayTime(minutes) {
    minutes = minutes || 0;
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return `${h} hr${h !== 1 ? 's' : ''} ${m} min${m !== 1 ? 's' : ''}`;
  }

  function timeAgo(unixSeconds) {
    const diff = Math.floor(Date.now() / 1000) - unixSeconds;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function hide(el) { el.style.display = 'none'; }
  function show(el, display) { el.style.display = display || 'block'; }

  function render(data) {
    const friend = data.friend;
    const state = (friend.presence.state || 'OFFLINE').toUpperCase();
    const game = friend.presence.game || {};

    document.getElementById('avatarImage').src = friend.imageUri;
    document.getElementById('playerName').textContent = friend.name;
    document.getElementById('lastUpdated').textContent = 'Updated ' + timeAgo(friend.presence.updatedAt);

    const dot = document.getElementById('statusDot');
    const statusText = document.getElementById('onlineStatus');
    const gameSection = document.getElementById('gameSection');
    const emptyState = document.getElementById('emptyState');

    dot.className = 'dot';

    if (state === 'OFFLINE') {
      statusText.textContent = 'Offline';
      hide(gameSection);
      show(emptyState);
      emptyState.textContent = `${friend.name} is not on the Nintendo Switch right now.`;
      return;
    }

    if (state === 'INACTIVE') {
      dot.classList.add('inactive');
      statusText.textContent = 'On the Home Menu';
      hide(gameSection);
      show(emptyState);
      emptyState.textContent = `${friend.name} is chilling on the home menu.`;
      return;
    }

    // ONLINE or PLAYING
    dot.classList.add('online');
    statusText.textContent = 'Online';

    if (!game.name) {
      hide(gameSection);
      show(emptyState);
      emptyState.textContent = `${friend.name} is online, but not currently playing a game.`;
      return;
    }

    hide(emptyState);
    show(gameSection, 'grid');

    document.getElementById('gameImage').src = game.imageUri;
    document.getElementById('gameName').textContent = game.name;

    const platformType = document.getElementById('platformType');
    platformType.textContent = friend.presence.platform === 2 ? 'Nintendo Switch 2' : 'Nintendo Switch';

    document.getElementById('totalPlayTime').textContent = formatPlayTime(game.totalPlayTime);

    const shopLink = document.getElementById('gameShopLink');
    if (game.shopUri) {
      shopLink.href = game.shopUri;
      show(shopLink, 'inline-block');
    } else {
      hide(shopLink);
    }

    // sysDescription (only for non-Splatoon titles that provide it)
    const sysDescRow = document.getElementById('sysDescriptionRow');
    if (game.sysDescription) {
      document.getElementById('sysDescription').textContent = game.sysDescription;
      show(sysDescRow);
    } else {
      hide(sysDescRow);
    }

    // Splatoon 3: VS mode / stages
    const splatoonRow = document.getElementById('splatoonModeRow');
    const salmonRow = document.getElementById('salmonRunRow');
    hide(splatoonRow);
    hide(salmonRow);

    if (data.splatoon3_coop_setting) {
      const coop = data.splatoon3_coop_setting;
      document.getElementById('salmonRunBoss').textContent = coop.boss ? coop.boss.name : 'Unknown Boss';
      document.getElementById('salmonRunStage').textContent = coop.coopStage ? coop.coopStage.name : 'Unknown Stage';
      show(salmonRow, 'block');
    } else if (data.splatoon3_vs_setting && data.splatoon3 && data.splatoon3.vsMode) {
      document.getElementById('splatoonMode').textContent = data.splatoon3.vsMode.name;
      const stages = (data.splatoon3_vs_setting.vsStages || []).map(s => s.name).join(' & ');
      document.getElementById('splatoonStages').textContent = stages ? '— ' + stages : '';
      show(splatoonRow, 'block');
    }
  }

  async function refresh() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      render(data);
    } catch (err) {
      document.getElementById('onlineStatus').textContent = 'Unable to load status';
      console.error('Switch status fetch failed:', err);
    }
  }

  function startFallbackTimer() {
    if (fallbackInterval) clearInterval(fallbackInterval);
    fallbackInterval = setInterval(refresh, FALLBACK_REFRESH_MS);
  }

  function initLiveUpdates() {
    refresh();
    startFallbackTimer();

    if ('EventSource' in window) {
      const eventSource = new EventSource(SSE_URL);

      eventSource.addEventListener('update', (event) => {
        try {
          if (event.data) {
            // Render directly from event payload (includes Splatoon 3 data)
            const data = JSON.parse(event.data);
            render(data);
          } else {
            refresh();
          }
        } catch (e) {
          refresh();
        }
        startFallbackTimer(); // Reset the 3-minute fallback timer
      });

      eventSource.onerror = () => {
        console.warn('Live event stream disconnected. Relying on fallback timer.');
      };
    }
  }

  initLiveUpdates();
</script>
</body>
</html>
